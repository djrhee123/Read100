<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Read100 Human Validation</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#182238;font-family:ui-sans-serif,-apple-system,"Segoe UI","Noto Sans KR",sans-serif}.wrap{max-width:1040px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid #e0e6ef;border-radius:20px;padding:18px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,select,textarea,button{font:inherit;padding:11px;border-radius:12px;border:1px solid #ccd6e5}textarea{width:100%;min-height:90px}.btn{border:0;background:#173f78;color:#fff;font-weight:900;cursor:pointer}.btn.alt{background:#fff;color:#173f78;border:1px solid #cbd6e6;text-decoration:none}.states{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.state{padding:12px;border:1px solid #dce3ed;border-radius:14px}.result{padding:14px;background:#eef6ff;border-radius:15px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{padding:13px;border-radius:14px;background:#f8fafc;border:1px solid #e0e6ef}.metric b{display:block;font-size:24px}@media(max-width:650px){.states,.metrics{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="panel"><div class="row" style="justify-content:space-between"><div><h1 style="margin:0">Human Validation Kit v1.0</h1><p>사람 관찰을 먼저 저장한 뒤 시스템 판단을 공개합니다. False Positive를 별도로 계산합니다.</p></div><a class="btn alt" href="/fulltest.html?v=1.5">← 처음 화면</a></div></div>
<div class="panel"><h2>1. Blind Human Observation</h2><div class="row"><input id="observerPin" type="password" placeholder="Observer PIN"><input id="observer" placeholder="관찰자 ID"><input id="code" placeholder="참가자 코드"><select id="story"></select></div><h3>아이의 현재 상태를 사람의 관찰만으로 선택하세요.</h3><div class="states"><label class="state"><input type="radio" name="st" value="independent_mastery"> <b>혼자 안정적으로 이해</b><br>도움 없이 이해하고 새 상황에도 적용</label><label class="state"><input type="radio" name="st" value="supported_mastery"> <b>도움 후 이해</b><br>Hint/Relearn 뒤 회복</label><label class="state"><input type="radio" name="st" value="fragile_understanding"> <b>불안정한 이해</b><br>맞히지만 새 상황 적용은 불안정</label><label class="state"><input type="radio" name="st" value="needs_relearning"> <b>다시 학습 필요</b><br>도움 뒤에도 이해가 안정되지 않음</label></div><textarea id="note" placeholder="관찰 근거 메모(선택)"></textarea><button class="btn" onclick="saveObs()">사람 판단 저장 후 시스템과 비교</button><div id="result" style="margin-top:10px"></div></div>
<div class="panel"><h2>2. Validation Gate (Owner only)</h2><div class="row"><input id="ownerPin" type="password" placeholder="Owner PIN"><button class="btn alt" onclick="loadGate()">Gate 불러오기</button></div><div class="metrics"><div class="metric"><b id="n">0</b><span>비교 수</span></div><div class="metric"><b id="agree">-</b><span>Observer-Human 일치율</span></div><div class="metric"><b id="fp">-</b><span>False Positive</span></div></div><div id="gate" class="result" style="margin-top:10px">아직 비교 기록이 없습니다.</div></div></div><script>
const $=id=>document.getElementById(id);$('story').innerHTML='<option value="1">이야기 1 · 토끼와 거북이</option>';
async function saveObs(){const state=document.querySelector('input[name=st]:checked')?.value,body={observer_pin:$('observerPin').value,observer_id:$('observer').value.trim(),code:$('code').value.trim().toUpperCase(),story_id:Number($('story').value),human_state:state,note:$('note').value.trim()};if(!body.observer_pin||!body.observer_id||!body.code||!state){$('result').textContent='Observer PIN, 관찰자 ID, 참가자 코드, 사람 판단을 모두 입력하세요.';return}const r=await fetch('/api/validation/human',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok){$('result').textContent='저장하지 못했습니다.';return}$('result').innerHTML=`<div class="result"><b>사람 판단을 저장했습니다.</b><br>시스템: ${j.system.mastery_label}<br>일치: ${j.agreement?'✅ YES':'⚠️ NO'} ${j.false_positive?'<br><b>🔴 False Positive</b>':''}</div>`;}
async function loadGate(){const pin=$('ownerPin').value;if(!pin){$('gate').textContent='Owner PIN을 입력하세요.';return}const r=await fetch('/api/validation/summary?pin='+encodeURIComponent(pin)),j=await r.json();if(!r.ok){$('gate').textContent='Owner PIN을 확인하세요.';return}$('n').textContent=j.count;$('agree').textContent=j.agreement_rate==null?'-':j.agreement_rate+'%';$('fp').textContent=j.false_positive_rate==null?'-':j.false_positive_rate+'%';$('gate').innerHTML=j.count===0?'아직 비교 기록이 없습니다.':`False Positive ≤ 5% Gate: <b>${j.gate_false_positive_le_5?'✅ PASS':'❌ FAIL'}</b><br><small>실제 아동 Validation 표본이 충분해지기 전에는 Pilot Ready로 선언하지 않습니다.</small>`}
</script></body></html>
