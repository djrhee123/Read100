name: baseline-integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject credential/runtime files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(find . -type f \( -name 'PILOT_INVITES.txt' -o -name 'config.json' -o -name 'participants_seed.json' -o -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.env' \) -not -path './.git/*' -print)
          if [ -n "$forbidden" ]; then
            echo "Forbidden credential/runtime files found:"
            echo "$forbidden"
            exit 1
          fi
      - name: Python syntax check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, py_compile
          files=[p for p in pathlib.Path('.').rglob('*.py') if '.git' not in p.parts]
          for p in files:
              py_compile.compile(str(p), doraise=True)
          print(f'Python syntax PASS: {len(files)} files')
          PY
